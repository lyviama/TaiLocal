name: Build EXE

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pandas openpyxl opencc-python-reimplemented
      - run: python -m PyInstaller -y --onefile --noconsole --name TaiLocal --collect-all opencc --add-data "terms.csv;." --add-data "post_fix.csv;." tailocal.py
      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TaiLocal.exe
      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: TaiLocal-windows
          path: dist/TaiLocal.exe

  build-mac-arm:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pandas openpyxl opencc-python-reimplemented
      - run: python -m PyInstaller -y --onefile --windowed --name TaiLocal-mac-arm --collect-all opencc --add-data "terms.csv:." --add-data "post_fix.csv:." tailocal.py
      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TaiLocal-mac-arm
      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: TaiLocal-mac-arm
          path: dist/TaiLocal-mac-arm
